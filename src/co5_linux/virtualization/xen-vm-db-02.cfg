# ===========================================================================
#  CloudMatrix - Xen PV/HVM guest definition
#  File: /etc/xen/vm-db-02.cfg
#  Start with:  xl create /etc/xen/vm-db-02.cfg && xl console vm-db-02
#  Inspect  :  xl list ; xl vcpu-list vm-db-02 ; xl info
#
#  This is the database tier guest -- the workload that drove the CO3
#  hugepage and CPU-pinning decisions.
# ===========================================================================

name        = "vm-db-02"
type        = "hvm"
uuid        = "b2c1d4e6-0a72-4f18-9c33-7ea51d0b2f04"

# --- CPU -------------------------------------------------------------------
vcpus       = 4
maxvcpus    = 8                # room to hot-plug without a reboot

# Pin each vCPU to a dedicated physical core on NUMA node 0, where the
# guest's memory is allocated. Letting the scheduler migrate a database vCPU
# across NUMA nodes costs roughly 30% of its memory bandwidth, and the pinning
# is what makes the sub-10 ms response target in Section D achievable.
cpus        = ["8", "9", "10", "11"]
cpu_weight  = 512              # 2x the default 256: DB tier outranks batch
cpu_cap     = 0                # uncapped; the weight does the arbitration

# --- Memory ----------------------------------------------------------------
memory      = 8192             # MB, the ballooned floor
maxmem      = 16384            # MB, the ceiling the balloon may inflate to

# The balloon driver reclaims between `memory` and `maxmem`. The FLOOR is set
# at the measured working-set size, not lower: ballooning a guest below its
# working set converts host memory pressure into guest thrashing, which is
# strictly worse than the problem it was meant to solve.

# --- Storage ---------------------------------------------------------------
disk = [
    # The OS volume: qcow2, cached, writeback for throughput.
    "format=qcow2, vdev=xvda, access=rw, target=/var/lib/xen/images/vm-db-02-os.qcow2",

    # The database volume: a raw LVM logical volume passed straight through.
    # No qcow2 layer, no host page cache -- the database has its own buffer
    # pool and double-caching wastes host RAM the hypervisor needs elsewhere.
    "format=raw, vdev=xvdb, access=rw, backendtype=phy, target=/dev/vg_cloudmatrix/lv_db02_data",
]

# --- Networking ------------------------------------------------------------
vif = [
    "mac=52:54:00:a1:01:02, bridge=br0, model=virtio-net, rate=1000MB/s",
]

# --- Boot ------------------------------------------------------------------
boot        = "c"
kernel      = "/usr/lib/xen/boot/hvmloader"
builder     = "hvm"
device_model_version = "qemu-xen"

# --- Console and lifecycle -------------------------------------------------
serial      = "pty"
vnc         = 1
vnclisten   = "127.0.0.1"      # never expose VNC on the LAN unauthenticated
vncpasswd   = ""               # set via `xl vncpasswd` at deploy time, not here

on_poweroff = "destroy"
on_reboot   = "restart"
on_crash    = "coredump-restart"   # keep the evidence, then come back up

# --- Isolation -------------------------------------------------------------
# The guest may not see or touch host devices it was not explicitly given.
pci         = []
usbdevice   = ""
