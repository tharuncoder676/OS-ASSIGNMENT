# ===========================================================================
#  CloudMatrix - ISC DHCP server configuration
#  File: /etc/dhcp/dhcpd.conf
#  Host: dhcp.cloudmatrix.local (10.20.30.12)
#
#  Validate with:  dhcpd -t -cf /etc/dhcp/dhcpd.conf
# ===========================================================================

authoritative;
ddns-update-style none;

default-lease-time  3600;      # 1 hour: guests churn, so keep leases short
max-lease-time      86400;     # 24 hours ceiling for pinned workloads

option domain-name              "cloudmatrix.local";
option domain-name-servers      10.20.30.10, 10.20.30.11;
option ntp-servers              10.20.30.7;

log-facility local7;

# --- the management / guest bridge subnet ---------------------------------
subnet 10.20.30.0 netmask 255.255.255.0 {
    option routers              10.20.30.1;
    option subnet-mask          255.255.255.0;
    option broadcast-address    10.20.30.255;

    # Dynamic pool: 100 addresses for ephemeral guests.
    # .1-.99 is reserved for infrastructure and static guest reservations,
    # .200-.254 is held back as headroom for a future pool extension.
    range 10.20.30.100 10.20.30.199;

    # A guest that needs a stable identity gets a reservation keyed on its
    # MAC, so DNS and the reverse zone stay truthful across reboots.
    host vm-web-01 {
        hardware ethernet 52:54:00:a1:01:01;
        fixed-address 10.20.30.101;
        option host-name "vm-web-01";
    }
    host vm-db-02 {
        hardware ethernet 52:54:00:a1:01:02;
        fixed-address 10.20.30.102;
        option host-name "vm-db-02";
    }
    host vm-dns-03 {
        hardware ethernet 52:54:00:a1:01:03;
        fixed-address 10.20.30.103;
        option host-name "vm-dns-03";
    }
    host vm-win11-07 {
        hardware ethernet 52:54:00:a1:01:07;
        fixed-address 10.20.30.107;
        option host-name "vm-win11-07";
    }
}

# --- tenant overlay subnet, served through a relay -------------------------
subnet 10.20.40.0 netmask 255.255.255.0 {
    option routers              10.20.40.1;
    option subnet-mask          255.255.255.0;
    range 10.20.40.50 10.20.40.150;
    default-lease-time 1800;    # tenants churn faster still
}

# --- the hypervisor's own segment is served statically, never by DHCP ------
subnet 10.20.50.0 netmask 255.255.255.0 {
}

# --- classify PXE-booting guests so they get the right netboot image -------
class "xen-pv-guests" {
    match if substring(option vendor-class-identifier, 0, 9) = "PXEClient";
    next-server 10.20.30.5;
    filename "pxelinux.0";
}
